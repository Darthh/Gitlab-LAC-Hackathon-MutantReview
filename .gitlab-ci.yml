# Mutant Review pipeline.
#   Every MR:  validate -> test (SAST, secrets) -> review (Stryker on changed lines) -> govern (gate)
#   main:      package (image) -> deploy (Cloud Run, smoke test, rollback) -> monitor
# The gate is a required pipeline job, so only code whose changed lines are protected by
# tests (or carry a Maintainer's written override) can merge and reach the release path.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - local: ci/release.gitlab-ci.yml

stages: [validate, test, review, govern, package, deploy, monitor, proof]

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: "0"
  MUTANT_ACTION: "review"
  # The flow's service account. Set MUTANT_REVIEW_TOKEN (masked; Reporter role, api scope)
  # to let CI post findings and verify override comments.
  MUTANT_REVIEW_HANDLE: "@ai-mutant-review-evidence-triage-mutant-review"

# Node jobs only; GitLab's SAST and secret-detection analyzers bring their own images.
.node:
  image: node:24.16.0-bookworm
  before_script:
    - npm ci --no-audit --no-fund
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

baseline:
  extends: .node
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
  script:
    - npm run typecheck
    - npm test
    - npm run test:domain -- --coverage
    - npm run mr -- memory --check
    - npm run build
  artifacts:
    when: always
    expire_in: 30 days
    paths: [evidence/, coverage/]

# Proves the core safety claim on every pipeline: an AI-drafted test is kept only if it
# passes on the code and fails on its mutant. A plausible-but-useless draft is rejected.
verify:hallucination-check:
  extends: .node
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
  script:
    - npm run test:e2e
  timeout: 10 minutes

# Stryker on the changed lines only, every MR pipeline. Deterministic triage drops arid
# mutants and ranks at most three findings.
mutation:review:
  extends: .node
  stage: review
  needs: [baseline]
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
    - key: "mutant-review-$CI_PROJECT_ID-$CI_MERGE_REQUEST_IID-v1"
      paths: [evidence/incremental/]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - npm run review
  timeout: 10 minutes
  artifacts:
    when: always
    expire_in: 30 days
    paths: [evidence/]

# Posts the ranked findings once per head (at most three inline comments) and invites the
# author to mention the flow for verified test proposals. No model call happens here.
mutation:notify:
  extends: .node
  stage: review
  needs:
    - job: mutation:review
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $MUTANT_REVIEW_TOKEN'
  script:
    - npm run mr -- flow notify
  allow_failure: true

# Changed-line mutation score must clear .mutant-review/policy.json, or a Maintainer must
# comment "<handle> override <reason>" after the latest push. evidence/gate.json is the audit.
mutation:gate:
  extends: .node
  stage: govern
  needs:
    - job: mutation:review
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - npm run gate
  allow_failure: false
  artifacts:
    when: always
    expire_in: 30 days
    paths: [evidence/]

# Manual diagnostic that stays usable while a gate fails: a local sandbox repair experiment.
repair:sandbox-proof:
  extends: .node
  stage: proof
  needs: []
  rules:
    - if: '$MUTANT_ACTION == "sandbox-proof" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: manual
      allow_failure: false
  script:
    - npm run demo
  timeout: 10 minutes
  artifacts:
    when: always
    expire_in: 30 days
    paths: [evidence/]
