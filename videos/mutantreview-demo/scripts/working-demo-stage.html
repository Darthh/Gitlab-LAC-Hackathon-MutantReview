<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MutantReview — working demo</title><style>
*{box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;margin:0;background:#050506;color:#ececef;font-family:Arial,sans-serif}header{height:142px;padding:24px 30px;border-bottom:1px solid #4c4b51;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;line-height:1.2;margin:0 0 10px}header p{font-size:16px;color:#b2b2b6;margin:0}.controls{display:flex;gap:9px}button{border:1px solid #5a5961;border-radius:5px;background:#242329;color:#ececef;font-size:16px;padding:15px 17px;cursor:pointer}button.active{background:#194c40;border-color:#009777}button:disabled{opacity:.6}.workspace{height:938px;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1.85fr) minmax(560px,1fr)}iframe{width:100%;height:100%;border:0;background:#18171d}.console{height:938px;min-height:0;overflow:hidden;display:flex;flex-direction:column;min-width:0;border-left:1px solid #4c4b51}.console-head{padding:17px 22px;border-bottom:1px solid #4c4b51;background:#18171d;display:flex;align-items:center;justify-content:space-between;font-size:17px}.console-head span{color:#91d4a8}.tabs{display:flex;padding:10px 14px;gap:8px}.tabs button{padding:9px 12px;font-size:14px}.terminal{font-family:Consolas,monospace;font-size:17px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;margin:0;padding:18px 22px;flex:1;min-height:0}.line{display:block}.line.good{color:#91d4a8}.line.bad{color:#ffb0bc}.line.command{color:#9dc7f1;margin-top:15px}.status{font-size:14px;color:#b2b2b6}.code{display:none}#banner{color:#91d4a8}.badge{font-size:14px;color:#b2b2b6;border:1px solid #4c4b51;padding:8px 11px}
</style></head><body><header><div><h1>MutantReview <span style="color:#009777">/</span> working demo</h1><p>Real local execution · Vitest + Stryker · dark Front Desk</p></div><div class="controls"><button data-action="review">1. Run review</button><button data-action="reject">2. Try ineffective test</button><button data-action="verify">3. Verify boundary test</button><button data-action="apply">4. Apply + rerun</button></div></header><div class="workspace"><iframe id="app" src="http://127.0.0.1:4184" title="Actual MutantReview Front Desk"></iframe><aside class="console"><div class="console-head"><span id="banner">Ready to run</span><small id="elapsed" class="status">Local demo controls</small></div><div class="tabs"><button id="output-tab">Run output</button><button id="source-tab">Source code</button><button id="test-tab">Test file</button></div><pre id="terminal" class="terminal"></pre><pre id="code" class="terminal code"></pre></aside></div><script>
const terminal=document.querySelector('#terminal'),code=document.querySelector('#code'),banner=document.querySelector('#banner'),buttons=[...document.querySelectorAll('[data-action]')];let began=null,timer=null;
function output(){terminal.style.display='block';code.style.display='none'}
document.querySelector('#output-tab').onclick=output;
for(const which of ['source','test'])document.querySelector('#'+which+'-tab').onclick=async()=>{code.textContent=await(await fetch('/code?file='+which)).text();terminal.style.display='none';code.style.display='block'};
for(const b of buttons)b.onclick=async()=>{output();await fetch('/run?action='+b.dataset.action,{method:'POST'})};
const events=new EventSource('/events');events.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='start'){terminal.textContent='';output();banner.textContent='Running: '+m.text;buttons.forEach(b=>{b.disabled=true;b.classList.toggle('active',b.dataset.action===m.text)});began=Date.now();timer=setInterval(()=>{document.querySelector('#elapsed').textContent=((Date.now()-began)/1000).toFixed(1)+'s elapsed'},100)}else if(m.type==='line'){const line=document.createElement('span');line.className='line'+(/VERIFIED|AFTER REPAIR|passed|100%/.test(m.text)?' good':/REJECTED|failed|survivor/.test(m.text)?' bad':m.text.startsWith('$')?' command':'');line.textContent=m.text;terminal.append(line);terminal.scrollTop=terminal.scrollHeight}else if(m.type==='done'){clearInterval(timer);buttons.forEach(b=>b.disabled=false);banner.textContent=m.text==='failed'?'Command failed':m.text==='apply'?'Repair verified · gate passed':'Completed: '+m.text;if(m.text==='review'||m.text==='apply')document.querySelector('#app').src='http://127.0.0.1:4184/?refresh='+Date.now()}};
</script></body></html>
